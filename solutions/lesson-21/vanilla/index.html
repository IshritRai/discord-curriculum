<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The real title, favicon and logo come from js/brand.js -->
    <title>Loading…</title>
    <link rel="icon" href="assets/brand/logo.svg">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/server-rail.css">
    <link rel="stylesheet" href="css/channels.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/members.css">
    <link rel="stylesheet" href="css/voice.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- A module script: it can import other files, and runs after the page has been read -->
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- The server rail and channel sidebar together (on phones they slide in as a "drawer") -->
      <div class="nav-drawer">
        <!-- 1. Server rail: one button per server -->
        <nav class="server-rail" aria-label="Servers">
          <ul class="server-list">
            <li class="server-item">
              <button class="server-button home-button" type="button" aria-label="Direct Messages">
                <img class="brand-logo" src="assets/brand/logo.svg" alt="">
              </button>
            </li>
            <li class="server-separator" role="separator"></li>
          </ul>
          <ul class="server-list" id="server-list"></ul>
          <ul class="server-list">
            <li class="server-item">
              <button class="server-button add-server-button" type="button" aria-label="Add a Server">
                <svg class="icon"><use href="assets/icons.svg#plus"></use></svg>
              </button>
            </li>
          </ul>
        </nav>

        <!-- 2. Channel sidebar: server name, channels, and your user panel -->
        <aside class="channel-sidebar" aria-label="Channels">
          <header class="sidebar-header">
            <h1 class="server-name" id="server-name">Frontend Friends</h1>
            <svg class="icon"><use href="assets/icons.svg#chevron-down"></use></svg>
          </header>
          <nav class="channel-list scroller" id="channel-list" aria-label="Channel list"></nav>

          <section class="user-panel" aria-label="Your account">
            <button class="user-panel-profile" type="button" id="user-panel-profile">
              <span class="avatar status-online" id="user-panel-avatar">S<span class="status-dot"></span></span>
              <span class="user-panel-names">
                <span class="user-panel-name" id="user-panel-name">Sam</span>
                <span class="user-panel-tag" id="user-panel-tag">Learning frontend 🚀</span>
              </span>
            </button>
            <button class="icon-button" type="button" id="mute-button" aria-label="Mute">
              <svg class="icon"><use href="assets/icons.svg#mic"></use></svg>
            </button>
            <button class="icon-button" type="button" id="deafen-button" aria-label="Deafen">
              <svg class="icon"><use href="assets/icons.svg#headphones"></use></svg>
            </button>
            <button class="icon-button" type="button" id="settings-button" aria-label="User Settings">
              <svg class="icon"><use href="assets/icons.svg#settings"></use></svg>
            </button>
          </section>
        </aside>
      </div>

      <!-- 3. Chat: header, messages, message box, and the member list -->
      <main class="chat">
        <header class="chat-header">
          <button class="icon-button menu-button" type="button" id="menu-button" aria-label="Open channels" aria-expanded="false">
            <svg class="icon"><use href="assets/icons.svg#menu"></use></svg>
          </button>
          <svg class="icon chat-header-icon"><use href="assets/icons.svg#hash"></use></svg>
          <h2 class="chat-title" id="chat-title">general</h2>
          <p class="chat-topic" id="chat-topic">Chat about anything frontend: HTML, CSS, JavaScript, React.</p>
          <div class="chat-toolbar">
            <button class="icon-button" type="button" aria-label="Notification Settings">
              <svg class="icon"><use href="assets/icons.svg#bell"></use></svg>
            </button>
            <button class="icon-button" type="button" aria-label="Pinned Messages">
              <svg class="icon"><use href="assets/icons.svg#pin"></use></svg>
            </button>
            <button class="icon-button" type="button" id="members-button" aria-label="Member List" aria-pressed="true">
              <svg class="icon"><use href="assets/icons.svg#members"></use></svg>
            </button>
            <label class="search">
              <input class="search-input" type="search" placeholder="Search" aria-label="Search">
              <svg class="icon"><use href="assets/icons.svg#search"></use></svg>
            </label>
            <button class="icon-button" type="button" aria-label="Inbox">
              <svg class="icon"><use href="assets/icons.svg#inbox"></use></svg>
            </button>
            <button class="icon-button" type="button" aria-label="Help">
              <svg class="icon"><use href="assets/icons.svg#help"></use></svg>
            </button>
          </div>
        </header>

        <div class="chat-body">
          <section class="chat-main" aria-label="Messages">
            <ol class="message-list scroller" id="message-list"></ol>

            <form class="composer" id="composer">
              <button class="icon-button composer-button" type="button" aria-label="Upload a file">
                <svg class="icon"><use href="assets/icons.svg#plus"></use></svg>
              </button>
              <textarea class="composer-input" id="composer-input" rows="1" placeholder="Message #general" aria-label="Message"></textarea>
              <button class="icon-button composer-button" type="button" aria-label="Choose an emoji">
                <svg class="icon"><use href="assets/icons.svg#emoji"></use></svg>
              </button>
            </form>
          </section>

          <aside class="member-list scroller" id="member-list" aria-label="Members"></aside>
        </div>
      </main>
    </div>

    <!-- The dark overlay behind the drawer on small screens -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
  </body>
</html>
