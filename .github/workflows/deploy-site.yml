# Builds the course website and publishes it to GitHub Pages.
# Runs on every push to main, and can be started by hand from the Actions tab.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
name: Deploy course website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the lessons
        run: |
          npm run check:concepts
          npm run check:lessons

      - name: Build the reference apps (linked from each lesson page)
        run: npm run demos

      - name: Build the website
        # The site lives at https://<user>.github.io/<repo>/, so every link needs the repo name in front.
        run: SITE_BASE=/${{ github.event.repository.name }}/ npm run site:build

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
